name: Build and test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ ffmpeg dbus shellcheck desktop-file-utils \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qtquick-window \
            qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript \
            qml6-module-qtmultimedia qml6-module-qttest
      - name: Configure regression tests without Whisper
        run: cmake --preset tests
      - name: Build regression tests
        run: cmake --build --preset tests --parallel 2
      - name: Run regression tests
        run: ctest --preset tests
      - name: Validate installation files
        run: |
          shellcheck scripts/install.sh
          desktop-file-validate packaging/mapl-player.desktop
      - name: Configure the full application
        run: cmake -S . -B build/app -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build the full application
        run: cmake --build build/app --parallel 2
      - name: Test relocated application and Open With startup
        run: ctest --test-dir build/app -R '^installedapplication$' --output-on-failure
